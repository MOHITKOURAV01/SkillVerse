name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      # Fails the build when a locale drifts from public/locales/en. i18n falls
      # back to English, so without this a half-translated feature ships green.
      - name: Verify Translation Parity
        run: npm run check:translations

      # Note: Skipped lint, typecheck, and test as those scripts do not exist in package.json
      - name: Build Project
        run: npm run build
